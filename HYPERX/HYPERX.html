<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FONDO Interactivo</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; background: #020617; color: #fff; }

    /* ╔════════════════════════════════════════════════════════╗
       ║  VIDEO DE FONDO — autoajuste a la resolución           ║
       ║  detectada: 100vw/100vh llena la pantalla sea cual sea ║
       ║  la resolución del monitor y object-fit:cover recorta  ║
       ║  el sobrante en cualquier relación de aspecto          ║
       ║  (16:9, 16:10, ultrawide, HD, 4K...).                  ║
       ╚══════════════════════════════════════════════════════╝ */
    #videoFondo {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      z-index: 0;
    }

    .overlay-gradient {
      position: fixed; inset: 0; z-index: 1;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.5) 100%),
        linear-gradient(to right, rgba(0,0,0,0.15) 0%, transparent 50%, rgba(0,0,0,0.15) 100%);
      pointer-events: none;
    }

    .overlay-dots {
      position: fixed; inset: 0; z-index: 1;
      background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* ╔════════════════════════════════════════════════════════╗
       ║  HOTSPOT RECTANGULAR — TAMAÑO AQUÍ                     ║
       ║  Cambia width y height para ajustar las medidas        ║
       ╚══════════════════════════════════════════════════════╝ */
    .hotspot {
      position: absolute; z-index: 10;
      width: 120px;        /* ← ANCHO del botón */
      height: 120px;       /* ← ALTO del botón */
      border-radius: 10px; /* ← Esquinas redondeadas (0 = cuadro perfecto) */
      border: 2px solid rgba(255,255,255,0.45); /* ← ya está visible por defecto */
      cursor: pointer;
      box-shadow: none;
      background: transparent;
      opacity: .05;
    }
    .hotspot img { display: none; }
    .hotspot::before { display: none; }
    .hotspot::after { display: none; }
    .hotspot-label { display: none; }
    .hotspot:hover {
      opacity: 0.5;
      border: 1px dashed rgba(34,211,238,0.4);
      box-shadow: 0 0 20px rgba(34,211,238,0.15);
    }

    .hotspot img {
      width: 100%; height: 100%; object-fit: FILL;
      transition: transform 0.5s ease;
    }
    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.18);
      border-color: rgba(0, 0, 0, 0);
      box-shadow: 0 0 10px rgba(236, 7, 7, 0), 0 8px 32px rgba(0,0,0,0.4);
      z-index: 20;
    }
    .hotspot:hover img { transform: scale(1.12); }

    /* Hotspot que abre la galería configurable */
    .gallery-hotspot {
      opacity: .9;
      border: 0px solid rgba(0, 0, 0, 0.28);
      background: transparent;
      border-radius: 0;
    }
    .gallery-hotspot img {
      display: block;
      width: 100%; height: 100%;
      object-fit: FILL;
    }

    .gallery-panel {
      position: fixed;
      inset: 40% auto auto 56%;
      transform: translate(-50%, -50%) scale(.94);
      z-index: 60;
      width: min(92vw, 1400px);
      max-height: 100vh;
      padding: 28px;
      overflow-y: auto;
      background: rgba(42, 15, 15, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
    }
    .gallery-panel.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .gallery-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }
    .gallery-header h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
    .gallery-header p { margin-top: 6px; color: #94a3b8; }
    .gallery-close {
      flex: 0 0 auto;
      width: 50px; height: 50px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      color: #fff;
      background: rgba(255,255,255,.08);
      cursor: pointer;
      font-size: 40px;
      line-height: 1;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .gallery-card {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      background: rgba(255,255,255,.06);
    }
    .gallery-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1.5 / 1;
      object-fit: cover;
    }
    .gallery-card-content { padding: 12px; }
    .gallery-card h3 { font-size: 1.5rem; }
    .gallery-card p { margin-top: 6px; color: #cbd5e1; font-size: 1rem; line-height: 1.4; }
    @media (max-width: 700px) {
      .gallery-panel { padding: 20px; }
      .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    
    /* ╔════════════════════════════════════════════════════════╗
       ║  HOTSPOT CON GIF — personaliza el botón con un GIF     ║
       ║  Añade  gif: 'archivo.gif'  al objeto del hotspot.     ║
       ║  Sin esa propiedad, el botón queda transparente.       ║
       ╚══════════════════════════════════════════════════════╝ */
    .hotspot.con-gif {
      opacity: 0.9;               /* el GIF se ve siempre, no solo al hover */
      border: none;
      background: transparent;
      border-radius: 0;
    }
    .hotspot.con-gif img {
      display: block;           /* anula el display:none de los hotspots */
      width: 100%; height: 100%;
      object-fit: FILL;      /* muestra el GIF completo, sin recortarlo */
    }

    /* Anillo pulsante (adaptado a rectángulo) */
    .hotspot::before {
      content: '';
      position: absolute; inset: -5px;
      border-radius: inherit;
      border: 1.5px solid rgba(148, 0, 0, 0.25);
      animation: pulse-ring 2.5s ease-out infinite;
    }
    .hotspot::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      background: rgba(0,0,0,0.12);
      transition: background 0.3s;
    }
    .hotspot:hover::after { background: rgba(0,0,0,0); }

    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    .hotspot-label {
      position: absolute;
      bottom: -26px; left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      pointer-events: none;
    }

    /* Panel flotante */
    .info-panel {
      position: fixed;
      top: 39%; left: 56%;
      transform: translate(-50%, -50%) scale(0.9);
      z-index: 50;
      width: min(78%, 90vw);
      height: min(76%, 90vw);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: all 0.45s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 25px 60px rgba(3, 3, 3, 0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
    }
    .info-panel.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .info-panel-image {
      width: 100%; height: 350px;
      object-fit: cover;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .info-panel.image-only-panel .info-panel-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-bottom: 0;
    }
    .info-panel.image-only-panel .info-panel-content { display: none; }
    .info-panel-content {
      padding: 28px 32px 32px;
      overflow-y: auto;
      max-height: calc(80vh - 220px);
    }
    .info-panel.first-four-panel .info-panel-content {
      height: calc(100% - 350px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .info-panel.first-four-panel #panelDescription {
      flex: 1;
      display: flex;
      align-items: center;
    }
    .info-panel-content::-webkit-scrollbar { width: 4px; }
    .info-panel-content::-webkit-scrollbar-track { background: transparent; }
    .info-panel-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 30;
      padding: 20px 32px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
    }

    .bg-name {
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    
    .btn-pagina:hover {
      background: rgba(34,211,238,0.25);
      border-color: rgba(34,211,238,0.8);
      box-shadow: 0 0 16px rgba(34,211,238,0.25);
    }
    /* Posición del botón flotante (esquina superior derecha) */
    .btn-pagina-flotante {
      position: fixed;
      top: 20px; right: 24px;
      z-index: 30;
    }

    /* ╔════════════════════════════════════════════════════════╗
       ║  UTILIDADES — reemplazan Tailwind CDN                  ║
       ║  (el wallpaper debe ser autocontenido: sin red)        ║
       ╚══════════════════════════════════════════════════════╝ */
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-3 { gap: .75rem; }
    .mt-1 { margin-top: .25rem; }
    .mt-0\.5 { margin-top: .125rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-5 { margin-bottom: 1.25rem; }
    .w-2 { width: .5rem; }
    .h-2 { height: .5rem; }
    .w-21 { width: 5.25rem; }
    .h-12 { height: 3rem; }
    .rounded-full { border-radius: 9999px; }
    .rounded-lg { border-radius: .5rem; }
    .object-cover { object-fit: cover; }
    .text-xs { font-size: .75rem; line-height: 1rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
    .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
    .text-5xl { font-size: 3rem; line-height: 1; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .uppercase { text-transform: uppercase; }
    .tracking-tight { letter-spacing: -.025em; }
    .tracking-wider { letter-spacing: .05em; }
    .leading-relaxed { line-height: 1.625; }
    .text-slate-300 { color: #cbd5e1; }
    .text-slate-400 { color: #94a3b8; }
    .bg-cyan-400 { background-color: #22d3ee; }
    .animate-pulse { animation: pulso 2s cubic-bezier(.4,0,.6,1) infinite; }
    @keyframes pulso { 50% { opacity: .5; } }


  </style>
</head>
<body>

  <!-- Fondo -->
  <video autoplay muted loop id="videoFondo">
    <source src="15-Ga0001la.webm" type="video/webm">
    Tu navegador no soporta video HTML5.
  </video>

  <!-- Overlays -->
  <div class="overlay-gradient"></div>
  <div class="overlay-dots"></div>

  

    <!-- Hotspots -->
  <div class="hotspots-container" id="hotspotsContainer" style="position:fixed;inset:0;z-index:5;"></div>

  <!-- Panel flotante -->
  <div class="info-panel" id="infoPanel">
    <img id="panelImage" class="info-panel-image" src="" alt="">
      <div class="info-panel-content">
      <div class="flex items-center gap-3 mb-4">
        <img id="panelIcon" class="w-21 h-12 rounded-lg object-cover" src="HXLOGO.png" alt="">
        <div>
          <h3 id="panelTitle" class="text-5xl font-semibold tracking-tight"></h3>
          <p id="panelSubtitle" class="text-xl text-slate-400 font-medium uppercase tracking-wider mt-0.5"></p>
        </div>
      </div>
      <p id="panelDescription" class="text-slate-300 text-3xl leading-relaxed mb-5"></p>
    </div>
  </div>

  <!-- Galería: sus cuatro imágenes se editan en GALLERY_HOTSPOT -->
  <section class="gallery-panel" id="galleryPanel" aria-hidden="true">
    <div class="gallery-header">
      <div>
        <h2 id="galleryTitle"></h2>
        <p id="galleryDescription"></p>
      </div>
      <button class="gallery-close" id="galleryClose" type="button" aria-label="Cerrar galería">&times;</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <script>
    // ╔═══════════════════════════════════════════════════════════╗
    // ║  DATOS — Edita aquí los hotspots (Boton)                  ║
    // ║                                                           ║
    // ║  x, y = posición en PORCENTAJE (0–100) desde              ║
    // ║         la esquina superior izquierda                     ║
    // ║                                                           ║
    // ║  Para tamaño individual por hotspot, añade                ║
    // ║  "width": "150px" y/o "height": "100px" en cada objeto.   ║
    // ║  Si no los pones, usa el tamaño por defecto del CSS.      ║
    // ╚═══════════════════════════════════════════════════════════╝
    const HOTSPOTS = [
      {
        x: 6.5, y: 10,
        width: "200px",   // ← tamaño personalizado
        height: "150px",
        image: 'OMENIA.gif',
        title: 'OMEN IA',
        description: 'Una solución de un solo clic que analiza tu equipo y aplica automáticamente ajustes personalizados para maximizar los FPS al máximo nivel posible. Deja de solucionar problemas y recupera tu tiempo de juego con la IA de OMEN.'
      },
      {
        x: 6.5, y: 26,
        width: "200px",   // ← tamaño personalizado
        height: "150px",
        image: '170TPP.png',
        title: 'MODO UNLEASHED',
        description: 'Con OMEN Gaming Hub que te permite hacer «overclocking» manual de tus componentes hasta 170W TPP sin tener que tocar el BIOS. Y sin temer a causar daños permanentes a tu dispositivo, ten por seguro que hemos incluido medidas para evitar que eso suceda, así que deja de limitar tu rendimiento y empieza a dar rienda suelta a todo tu potencial.'
      },
      {
        x: 6.5, y: 45.5,
        width: "200px",   // ← tamaño personalizado
        height: "150px",
        image: 'FANCLENER.gif',
        title: 'TEMPEST COOLING & FAN CLEANER',
        description: 'La acumulación de calor puede ralentizar tu equipo; por eso Tempest Cooling y Fan Cleaner son la combinación perfecta para jugar todo el día, reduciendo el riesgo de calentamiento, manteniendo el rendimiento y prolongando la vida útil de tu laptop al expulsar el polvo automáticamente.'
      },
      {
        x: 6.5, y: 65.5,
        width: "200px",   // ← tamaño personalizado
        height: "150px",
        image: '8KHPR.GIF',
        title: 'Cada movimiento cuenta en el juego.',
        description: 'El teclado HyperAction con una frecuencia de sondeo de 8000 Hz ofrece un nuevo nivel de capacidad de respuesta, registrando cada pulsación en el instante en que se produce. Con entradas cuatro veces más rápidas, obtienes la velocidad y la precisión necesarias para reaccionar con mayor rapidez y mantener el control cuando más importa, de modo que cada movimiento se ejecute justo cuando lo necesitas.'
      },
      
      {
        x: 28, y: 87,
        width: "90px",   // ← SPECS
        height: "90px",
        image: 'I7.png'
      },

      {
        x: 36.2, y: 87,
        width: "210px",   // ← SPECS
        height: "90px",
        image: '5060.png'
      },
      {
        x: 58.2, y: 87,
        width: "570px",   // ← SPECS
        height: "90px",
        image: 'EXPANSION.png'
      },

      {
        x: 81.5, y: 87,
        width: "250px",   // ← SPECS
        height: "90px",
        image: 'PANTALLA.png'
      }




    ];

    // GALERÍA — cambia buttonImage y las cuatro tarjetas para personalizarla.
    const GALLERY_HOTSPOT = {
      x: 96, y: 77.5,
      width: '140px',
      height: '85px',
      buttonImage: 'HXattach.gif',
      title: 'Galería HyperX',
      description: 'Echa un vistazo a nuestros galardonados accesorios gaming.',
      images: [
        { image: 'audioHX.png', title: 'Audio' },
        { image: 'keyboardsHX.png', title: 'Teclados' },
        { image: 'miceHX.png', title: 'Mouse' },
        { image: 'mousepadsHX.png', title: 'Mousepad' }
      ]
    };

    const GALLERY_AUTO_CLOSE_SECONDS = 10;
    let galleryTimeout = null;
    let hideTimeout = null;

    function init() {
      renderHotspots();
    }

    function renderHotspots() {
      const container = document.getElementById('hotspotsContainer');
      const regularHotspots = HOTSPOTS.map((hs, i) => {
        const w = hs.width || '';
        const h = hs.height || '';
        const sizeStyle = (w || h) ? `width:${w};height:${h};` : '';
        return `
          <div class="hotspot"
               style="left:${hs.x}%;top:${hs.y}%;transform:translate(-50%,-50%);${sizeStyle}"
               onmouseenter="showPanel(${i})"
               onmouseleave="scheduleHide()">
            <img src="${hs.image}" alt="${hs.title || ''}" loading="lazy">
            <span class="hotspot-label">${hs.title || ''}</span>
          </div>`;
      }).join('');
      const galleryStyle = `left:${GALLERY_HOTSPOT.x}%;top:${GALLERY_HOTSPOT.y}%;` +
        `width:${GALLERY_HOTSPOT.width};height:${GALLERY_HOTSPOT.height};transform:translate(-50%,-50%);`;
      const galleryHotspot = `
        <button class="hotspot gallery-hotspot" type="button" style="${galleryStyle}"
                onclick="openGallery()" aria-label="Abrir ${GALLERY_HOTSPOT.title}">
          <img src="${GALLERY_HOTSPOT.buttonImage}" alt="${GALLERY_HOTSPOT.title}" loading="lazy">
        </button>`;
      container.innerHTML = regularHotspots + galleryHotspot;
    }

    function openGallery() {
      document.getElementById('galleryTitle').textContent = GALLERY_HOTSPOT.title;
      document.getElementById('galleryDescription').textContent = GALLERY_HOTSPOT.description;
      document.getElementById('galleryGrid').innerHTML = GALLERY_HOTSPOT.images.map((item) => `
        <article class="gallery-card">
          <img src="${item.image}" alt="${item.title}" loading="lazy">
          <div class="gallery-card-content">
            <h3>${item.title}</h3>
           
          </div>
        </article>`).join('');
      const panel = document.getElementById('galleryPanel');
      panel.classList.add('active');
      panel.setAttribute('aria-hidden', 'false');
      clearTimeout(galleryTimeout);
      galleryTimeout = setTimeout(closeGallery, GALLERY_AUTO_CLOSE_SECONDS * 800);
    }

    function closeGallery() {
      clearTimeout(galleryTimeout);
      galleryTimeout = null;
      const panel = document.getElementById('galleryPanel');
      panel.classList.remove('active');
      panel.setAttribute('aria-hidden', 'true');
    }

    function showPanel(index) {
      clearTimeout(hideTimeout);
      const hs = HOTSPOTS[index];
      if (!hs) return;

      document.getElementById('panelImage').src = hs.image;
      document.getElementById('panelTitle').textContent = hs.title;
      document.getElementById('panelDescription').textContent = hs.description;
      const panel = document.getElementById('infoPanel');
      panel.classList.toggle('image-only-panel', !hs.title && !hs.description);
      panel.classList.toggle('first-four-panel', index < 4);

      panel.classList.add('active');
    }

    function scheduleHide() {
      hideTimeout = setTimeout(hidePanel, 20);
    }

    function hidePanel() {
      document.getElementById('infoPanel').classList.remove('active');
    }

    // Abre otra página en ventana/pestaña nueva sin cerrar el wallpaper.
    // Cambia el argumento por el archivo que quieras (debe estar en la misma carpeta).
    function abrirPagina(url) {
      const nueva = window.open(url, '_blank');
      if (!nueva) window.location.href = url; // respaldo si el navegador bloquea popups
    }

    document.getElementById('infoPanel').addEventListener('mouseenter', () => clearTimeout(hideTimeout));
    document.getElementById('infoPanel').addEventListener('mouseleave', scheduleHide);
    document.getElementById('galleryClose').addEventListener('click', closeGallery);
    document.getElementById('galleryPanel').addEventListener('click', (e) => {
      if (e.target.id === 'galleryPanel') closeGallery();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hidePanel();
        closeGallery();
      }
    });

    init();
  </script>
</body>
</html>
